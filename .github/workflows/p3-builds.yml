name: p3-builds
on: [push, workflow_dispatch]

jobs:
  kit49:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw deps
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64
      - name: build 4.9 kit objects (official Arsenal Kit build.sh flags)
        run: |
          mkdir -p out
          x86_64-w64-mingw32-gcc -m64 -c -Os -Wall \
            -DUSE_Sleep -DMASK_TEXT_SECTION=0 -DUSE_SYSCALLS=0 -DSYSCALLS_none \
            p3/sleepmask-kit/src49/sleepmask.c -o out/sleepmask.x64.o
          x86_64-w64-mingw32-gcc -m64 -c -Os -Wall \
            -DUSE_Sleep -DMASK_TEXT_SECTION=0 -DUSE_SYSCALLS=0 -DSYSCALLS_none \
            p3/sleepmask-kit/src49/sleepmask_pivot.c -o out/sleepmask_pivot.x64.o
          i686-w64-mingw32-gcc -m32 -c -Os -Wall \
            -DUSE_Sleep -DMASK_TEXT_SECTION=0 -DUSE_SYSCALLS=0 -DSYSCALLS_none \
            p3/sleepmask-kit/src49/sleepmask.c -o out/sleepmask.x86.o
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: kit49-objs
          path: out/

  smvs:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: build sleepmask-vs techniques (Makefile clang-cl flags, direct invocation)
        shell: pwsh
        run: |
          $cl = "C:\Program Files\LLVM\bin\clang-cl.exe"
          if (!(Test-Path $cl)) { choco install -y llvm; $cl = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          New-Item -Force -ItemType Directory out | Out-Null
          $inc = @("/Ip3/sleepmask-vs", "/Ip3/bof-vs", "/Ip3/bof-vs/base")
          $targets = @("default-sleepmask", "indirectsyscalls-sleepmask", "retaddrspoofing-sleepmask", "draugr-sleepmask", "unit-test-bof")
          foreach ($t in $targets) {
            & $cl /c /GS- /GF- /std:c++20 -fno-jump-tables -m64 $inc "p3\sleepmask-vs\$t.cpp" /Fo:"out\$t.x64.o"
            if ($LASTEXITCODE -ne 0) { Write-Host "FAILED: $t"; exit 1 }
          }
          Get-ChildItem out | Format-Table Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: smvs-objs
          path: out/

  eden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw deps
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64
      - name: build eden mingw objects (Makefile object targets; debug-exe targets need generated beacon bins, skipped)
        run: |
          cd p3/eden && mkdir -p bin
          x86_64-w64-mingw32-gcc -DWIN_X64 -shared -masm=intel -Wall -Wno-pointer-arith -c src/loader.c -o bin/loader.x64.o
          x86_64-w64-mingw32-gcc -DWIN_X64 -shared -masm=intel -Wall -Wno-pointer-arith -c src/guardexec.c -o bin/guardexec.x64.o
          x86_64-w64-mingw32-gcc -DWIN_X64 -shared -masm=intel -Wall -Wno-pointer-arith -fno-jump-tables -c src/draugr/draugr.c -o bin/draugr.x64.o
          ls -la bin/
      - uses: actions/upload-artifact@v4
        with:
          name: eden-objs
          path: p3/eden/bin/

  csm:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: msbuild CallStackMasker
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe
          & $msbuild p3\CallStackMasker\CallStackMasker.sln /p:Configuration=Release /p:Platform=x64 /m /v:m
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem -Recurse p3\CallStackMasker -Include *.exe | Format-Table FullName,Length
      - uses: actions/upload-artifact@v4
        with:
          name: csm-exe
          path: p3/CallStackMasker/x64/Release/

  vncdll:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: msbuild vncdll (rsmudge fork of the MSF TightVNC reflective server)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installerswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe
          & $msbuild p3ncdllncdll.sln /p:Configuration=Release /p:Platform=x64 /m /v:m
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $msbuild p3ncdllncdll.sln /p:Configuration=Release /p:Platform=Win32 /m /v:m
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem -Recurse p3ncdll -Include *.dll | Format-Table FullName,Length
      - uses: actions/upload-artifact@v4
        with:
          name: vncdll-dlls
          path: p3/vncdll/winvnc/Release*/
