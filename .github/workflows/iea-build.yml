name: iea-build
on:
  push:
    paths:
      - "iea/**"
      - ".github/workflows/iea-build.yml"
  workflow_dispatch:
jobs:
  iea:
    name: InlineExecute-Assembly BOF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: |
          cd iea/src
          x86_64-w64-mingw32-gcc -w -c inlineExecute-Assembly.c -o ../iea.x64.o
      - uses: actions/upload-artifact@v4
        with:
          name: iea-x64
          path: iea/iea.x64.o
