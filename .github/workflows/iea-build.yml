name: iea-build
on:
  push:
    paths:
      - "iea/**"
      - ".github/workflows/iea-build.yml"
  workflow_dispatch:
jobs:
  iea:
    name: InlineExecute-Assembly BOF (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build BOF
        shell: cmd
        run: |
          cl /nologo /W0 /O2 /GS- /c /Fo iea\ iea\src\inlineExecute-Assembly.c || exit /b 1
          dir iea\*.o
      - uses: actions/upload-artifact@v4
        with:
          name: iea-x64
          path: iea\*.o
