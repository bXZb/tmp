name: c2ext-builds
on: [push, workflow_dispatch]

jobs:
  udc2-vs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw deps (g++ for C++ BOFs)
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-mingw-w64
      - name: build udc2-vs TCP reference BOF (x64 + x86)
        run: |
          mkdir -p out
          cd p3/c2ext/udc2-vs/udc2-bof-vs
          sed -i -e 's/<Windows.h>/<windows.h>/g' -e 's#base\\helpers.h#base/helpers.h#g' -e 's#\\#/#g' udc2_bof.cpp
          x86_64-w64-mingw32-g++ -c -std=c++20 -fno-exceptions -fno-rtti -fno-stack-protector -O2 \
            udc2_bof.cpp -o $GITHUB_WORKSPACE/out/udc2.x64.o
          i686-w64-mingw32-g++ -c -std=c++20 -fno-exceptions -fno-rtti -fno-stack-protector -O2 \
            udc2_bof.cpp -o $GITHUB_WORKSPACE/out/udc2.x86.o
          ls -la $GITHUB_WORKSPACE/out/
      - uses: actions/upload-artifact@v4
        with:
          name: udc2-vs-bofs
          path: out/

  extc2-example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw deps
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64
      - name: build official extc2example quick client
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd p3/c2ext/External-C2
          i686-w64-mingw32-gcc -O2 -static extc2example.c -o "$GITHUB_WORKSPACE/out/extc2example.exe" -lws2_32
          x86_64-w64-mingw32-gcc -O2 -static extc2example.c -o "$GITHUB_WORKSPACE/out/extc2example64.exe" -lws2_32
          echo "--- import table self-check ---"
          i686-w64-mingw32-objdump -x "$GITHUB_WORKSPACE/out/extc2example.exe" | grep "DLL Name" || true
          ls -la "$GITHUB_WORKSPACE/out"/
      - uses: actions/upload-artifact@v4
        with:
          name: extc2-example-exe
          path: out/

  icmp-udc2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw deps (g++ for C++ BOFs)
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-mingw-w64
      - name: build icmp-udc2 BOF (x64 + x86)
        run: |
          mkdir -p out
          cd p3/c2ext/icmp-udc2/icmp-udc2-bof
          sed -i -e 's/<Windows.h>/<windows.h>/g' -e 's/<IcmpAPI.h>/<icmpapi.h>/g' icmp_udc2_bof.cpp
          grep -n "serverAddr" icmp_udc2_bof.cpp | head -4
          x86_64-w64-mingw32-g++ -c -std=c++20 -fno-exceptions -fno-rtti -fno-stack-protector -O2 \
            icmp_udc2_bof.cpp -o $GITHUB_WORKSPACE/out/icmp_udc2.x64.o
          i686-w64-mingw32-g++ -c -std=c++20 -fno-exceptions -fno-rtti -fno-stack-protector -O2 \
            icmp_udc2_bof.cpp -o $GITHUB_WORKSPACE/out/icmp_udc2.x86.o
          ls -la $GITHUB_WORKSPACE/out/
      - uses: actions/upload-artifact@v4
        with:
          name: icmp-udc2-bofs
          path: out/

  s3-udc2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw deps (g++ - build.rs compiles the BOFs)
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-mingw-w64
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo build (relay + presign + all six BOFs via build.rs)
        run: |
          mkdir -p out
          cd p3/c2ext/s3-udc2
          sed -i 's/i686-w64-mingw32-gcc/i686-w64-mingw32-g++/' build.rs
          cargo build --release
          cp target/release/s3-udc2-relay $GITHUB_WORKSPACE/out/
          cp target/release/s3-udc2-presign $GITHUB_WORKSPACE/out/
          cp s3-udc2-bof/bofs/*.o $GITHUB_WORKSPACE/out/
          ls -la $GITHUB_WORKSPACE/out/
      - uses: actions/upload-artifact@v4
        with:
          name: s3-udc2-bins
          path: out/
