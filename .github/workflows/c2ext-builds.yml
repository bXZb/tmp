name: c2ext-builds
on: [push, workflow_dispatch]

jobs:
  udc2-vs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw deps (g++ for C++ BOFs)
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-mingw-w64
      - name: build udc2-vs TCP reference BOF (x64 + x86)
        run: |
          mkdir -p out
          cd p3/c2ext/udc2-vs/udc2-bof-vs
          x86_64-w64-mingw32-g++ -c -std=c++20 -fno-exceptions -fno-rtti -fno-stack-protector -O2 \
            udc2_bof.cpp -o ../../../../out/udc2.x64.o
          i686-w64-mingw32-g++ -c -std=c++20 -fno-exceptions -fno-rtti -fno-stack-protector -O2 \
            udc2_bof.cpp -o ../../../../out/udc2.x86.o
          ls -la ../../../../out/
      - uses: actions/upload-artifact@v4
        with:
          name: udc2-vs-bofs
          path: out/

  extc2-example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw deps
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64
      - name: build official extc2example quick client
        run: |
          mkdir -p out
          cd p3/c2ext/External-C2
          i686-w64-mingw32-gcc -O2 extc2example.c -o ../../out/extc2example.exe -lws2_32
          x86_64-w64-mingw32-gcc -O2 extc2example.c -o ../../out/extc2example64.exe -lws2_32
          ls -la ../../out/
      - uses: actions/upload-artifact@v4
        with:
          name: extc2-example-exe
          path: out/

  icmp-udc2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw deps (g++ for C++ BOFs)
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-mingw-w64
      - name: build icmp-udc2 BOF (x64 + x86)
        run: |
          mkdir -p out
          cd p3/c2ext/icmp-udc2/icmp-udc2-bof
          grep -n "serverAddr" icmp_udc2_bof.cpp | head -4
          x86_64-w64-mingw32-g++ -c -std=c++20 -fno-exceptions -fno-rtti -fno-stack-protector -O2 \
            icmp_udc2_bof.cpp -o ../../../../out/icmp_udc2.x64.o
          i686-w64-mingw32-g++ -c -std=c++20 -fno-exceptions -fno-rtti -fno-stack-protector -O2 \
            icmp_udc2_bof.cpp -o ../../../../out/icmp_udc2.x86.o
          ls -la ../../../../out/
      - uses: actions/upload-artifact@v4
        with:
          name: icmp-udc2-bofs
          path: out/

  s3-udc2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw deps (g++ - build.rs compiles the BOFs)
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-mingw-w64
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo build (relay + presign + all six BOFs via build.rs)
        run: |
          mkdir -p out
          cd p3/c2ext/s3-udc2
          cargo build --release
          cp target/release/s3-udc2-relay ../../out/
          cp target/release/s3-udc2-presign ../../out/
          cp s3-udc2-bof/bofs/*.o ../../out/
          ls -la ../../out/
      - uses: actions/upload-artifact@v4
        with:
          name: s3-udc2-bins
          path: out/
