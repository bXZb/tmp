name: openbeacon-build

on:
  push:
    paths:
      - "openbeacon/**"
      - ".github/workflows/openbeacon-build.yml"
  workflow_dispatch:

jobs:
  openbeacon-x64:
    name: OpenBeacon x64 DLL
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone libtomcrypt + libtommath
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.18.2 https://github.com/libtom/libtomcrypt.git $env:GITHUB_WORKSPACE\deps\libtomcrypt
          git clone --depth 1 --branch v1.3.0 https://github.com/libtom/libtommath.git $env:GITHUB_WORKSPACE\deps\libtommath
          Write-Host "cloned"

      - name: Build DLL
        shell: cmd
        run: |
          powershell -NoProfile -Command "(Get-ChildItem deps\libtomcrypt\src -Recurse -Filter *.c | Where-Object { $_.FullName -notmatch 'demo|test' } | ForEach-Object { $_.FullName }) + (Get-ChildItem deps\libtommath -Filter *.c | ForEach-Object { $_.FullName }) + (Get-ChildItem openbeacon\Beacon -Filter *.c | Where-Object { $_.Name -notmatch '^strategy_' -and $_.Name -ne 'main.c' } | ForEach-Object { $_.FullName }) | Where-Object { $_.Trim() -ne '' } | Set-Content -Encoding ascii allsrc.txt"
          powershell -NoProfile -Command "(Get-Content allsrc.txt | Measure-Object -Line).Lines"
          mkdir obout
          cl /nologo /W0 /LD /GS- /O2 /std:c17 /I deps\libtomcrypt\src\headers /I deps\libtommath /I openbeacon\Beacon /D_CRT_SECURE_NO_WARNINGS /DLTM_DESC /DLTC_HASH_HELPERS /DLTC_HMAC /DLTC_SOURCE /Fo obout\ @allsrc.txt /Feopenbeacon.x64.dll || exit /b 1
          if not exist openbeacon.x64.dll exit /b 1

      - name: Verify DLL
        shell: pwsh
        run: |
          Get-Item openbeacon.x64.dll | Format-List Length
          $bytes = [System.IO.File]::ReadAllBytes("openbeacon.x64.dll")
          if ($bytes.Length -lt 200000) { throw "dll too small" }
          Write-Host "dll ok"

      - uses: actions/upload-artifact@v4
        with:
          name: openbeacon-x64
          path: openbeacon.x64.dll
