name: openbeacon-build

on:
  push:
    paths:
      - "openbeacon/**"
      - ".github/workflows/openbeacon-build.yml"
  workflow_dispatch:

jobs:
  openbeacon-x64:
    name: OpenBeacon x64 DLL
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone libtomcrypt + libtommath
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.18.2 https://github.com/libtom/libtomcrypt.git $env:GITHUB_WORKSPACE\deps\libtomcrypt
          git clone --depth 1 --branch v1.3.0 https://github.com/libtom/libtommath.git $env:GITHUB_WORKSPACE\deps\libtommath
          Write-Host "cloned"

      - name: Build DLL
        shell: cmd
        run: |
          dir /s /b deps\libtomcrypt\src\*.c | findstr /v /i "demo test" > allsrc.txt
          dir /s /b deps\libtommath\*.c | findstr /v /i /c:"demo" /c:"test" /c:"mersenne.c" /c:"2kprime.c" /c:"drprime.c" /c:"pprime.c" /c:"tune.c" /c:"mont.c" >> allsrc.txt
          for %%f in (openbeacon\Beacon\*.c) do @(echo %%f | findstr /v /i "strategy_ main.c" >> allsrc.txt)
          mkdir obout
          cl /nologo /W0 /LD /GS- /O2 /std:c17 /I deps\libtomcrypt\src\headers /I deps\libtommath /I openbeacon\Beacon /D_CRT_SECURE_NO_WARNINGS /DLTM_DESC /DLTC_HASH_HELPERS /DLTC_HMAC /DLTC_SOURCE /DLTC_NO_SHA3 /Foobout\ @allsrc.txt /Feopenbeacon.x64.dll advapi32.lib || exit /b 1
          if not exist openbeacon.x64.dll exit /b 1

      - name: Verify DLL
        shell: pwsh
        run: |
          Get-Item openbeacon.x64.dll | Format-List Length
          $bytes = [System.IO.File]::ReadAllBytes("openbeacon.x64.dll")
          if ($bytes.Length -lt 200000) { throw "dll too small" }
          Write-Host "dll ok"

      - uses: actions/upload-artifact@v4
        with:
          name: openbeacon-x64
          path: openbeacon.x64.dll
