name: bofloader-xtf

on:
  push:
    paths:
      - "bofloader-xtf/**"
      - ".github/workflows/bofloader-xtf.yml"
  workflow_dispatch:

jobs:
  bofloader:
    name: XTF BOFLoader exe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        shell: cmd
        run: |
          cl /nologo /W0 /O2 /GS- /Febofloader.x64.exe bofloader-xtf\bofloader.c || exit /b 1
          dir bofloader.x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bofloader-x64
          path: bofloader.x64.exe
