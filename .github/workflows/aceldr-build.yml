name: aceldr-build

on:
  push:
    paths:
      - "aceldr/**"
      - ".github/workflows/aceldr-build.yml"
  workflow_dispatch:

jobs:
  aceldr:
    name: AceLdr x64 loader bin (mingw)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 nasm

      - name: Build loader bin
        shell: bash
        run: |
          cd aceldr/src
          # NASM objects
          nasm -f win64 asm/start.asm -o start.obj
          nasm -f win64 asm/spoof.asm -o spoof.obj
          nasm -f win64 asm/misc.asm -o misc.obj
          # C objects (mingw gcc, native GCC attributes valid)
          x86_64-w64-mingw32-gcc -c -O2 -std=c17 -I. ace.c util.c retaddr.c \
            hooks/delay.c hooks/heap.c hooks/spoof.c
          # locate mingw ld script template and build linker script
          x86_64-w64-mingw32-ld -i --verbose 2>/dev/null | sed -n '/^======/, /^======/p' | grep -v '=======' > linker_script.ld || true
          # link relocatable with gc, entry root
          x86_64-w64-mingw32-ld -T linker_script.ld --gc-sections -u Start \
            -i *.o -o ../AceLdr.x64.bin
          x86_64-w64-mingw32-strip --strip-unneeded ../AceLdr.x64.bin || true
          ls -la ../AceLdr.x64.bin
          test -s ../AceLdr.x64.bin

      - uses: actions/upload-artifact@v4
        with:
          name: aceldr-x64
          path: aceldr/AceLdr.x64.bin
